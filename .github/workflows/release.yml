name: Release

# Run from the Actions tab on a tag like v1.0.0 to build, test, package and draft a Windows release.
# Manual only: GitHub Actions is unavailable on this account. Locally: build Release, then run ISCC.exe installer\verbatim.iss.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    # A release needs a version tag; started from a branch, the job is skipped.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure and build
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release --parallel

      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { choco install innosetup -y --no-progress; $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup *\ISCC.exe" | Select-Object -First 1 }
          & $iscc.FullName "/DAppVersion=$('${{ github.ref_name }}'.TrimStart('v'))" installer\verbatim.iss

      - name: Zip the plugin bundle
        shell: pwsh
        run: Compress-Archive -Path build\Verbatim_artefacts\Release\VST3\Verbatim.vst3 -DestinationPath build\installer\Verbatim-${{ github.ref_name }}-vst3.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ github.ref_name }}" build/installer/*.exe build/installer/*.zip \
            --title "Verbatim ${{ github.ref_name }}" --notes "Windows x64 VST3. Run the installer, or unzip Verbatim.vst3 into C:\\Program Files\\Common Files\\VST3." --draft
