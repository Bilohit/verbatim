name: CI

# Manual only: GitHub Actions is unavailable on this account, so pushes do not trigger it.
# Run it from the Actions tab (Run workflow) once Actions is available.
on:
  workflow_dispatch:

jobs:
  win-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: UI browser tests (Playwright, mock bridge, installed Chrome)
        working-directory: gui
        run: npx playwright test --reporter=line

      - name: pluginval (strictness 10, 3 seeds)
        shell: bash
        run: |
          curl -sSfL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip
          unzip -q pluginval.zip
          for seed in 1 2 3; do
            ./pluginval.exe --strictness-level 10 --skip-gui-tests --seed $seed \
              --validate build/Verbatim_artefacts/Release/VST3/Verbatim.vst3
          done

  # G4: corpus.hashes may only change in commits tagged [grammar-change-approved].
  golden-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Self-test
        run: python3 tools/check_golden.py --self-test
      - name: Check pushed commits
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="HEAD"
          else
            RANGE="$BEFORE..HEAD"
          fi
          python3 tools/check_golden.py "$RANGE"

      - name: Steinberg VST3 validator (V3)
        shell: bash
        run: |
          git clone -q --depth 1 --branch v3.7.14_build_55 https://github.com/steinbergmedia/vst3sdk.git vst3sdk
          git -C vst3sdk submodule update --init --depth 1 base pluginterfaces public.sdk cmake
          cmake -S vst3sdk -B vst3sdk/build -A x64 -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF -DSMTG_ADD_VST3_PLUGINS_SAMPLES=OFF -DSMTG_ADD_VST3_HOSTING_SAMPLES=ON -DSMTG_CREATE_PLUGIN_LINK=OFF
          cmake --build vst3sdk/build --config Release --target validator
          vst3sdk/build/bin/Release/validator.exe build/Verbatim_artefacts/Release/VST3/Verbatim.vst3

  # Other compilers and OSes (docs/06-test-plan.md CI matrix): win-clangcl and linux-clang run core + dsp,
  # linux-gcc and macos-clang run core only.
  core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win-clangcl
            os: windows-latest
            configure: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DVERBATIM_BUILD_PLUGIN=OFF
          - name: linux-clang
            os: ubuntu-latest
            configure: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DVERBATIM_BUILD_PLUGIN=OFF
          - name: linux-gcc
            os: ubuntu-latest
            configure: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DVERBATIM_BUILD_PLUGIN=OFF -DVERBATIM_BUILD_DSP=OFF
          - name: macos-clang
            os: macos-latest
            configure: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVERBATIM_BUILD_PLUGIN=OFF -DVERBATIM_BUILD_DSP=OFF
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.name == 'win-clangcl'
      - name: JUCE build dependencies
        if: matrix.name == 'linux-clang'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libgl1-mesa-dev
      - name: Configure
        run: ${{ matrix.configure }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure

  # RT1 (RealtimeSanitizer on the dsp suite) and the ASan + UBSan run of F1, both clang 20 on Linux.
  linux-sanitizers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: rtsan
            flags: -fsanitize=realtime
            target: verbatim_dsp_tests
            filter: "RT2|R1|R4|D8"
          - name: asan-ubsan
            flags: -fsanitize=address,undefined -fno-sanitize-recover=undefined
            target: verbatim_core_tests
            filter: "F1|F4|G3"
    name: linux-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: clang 20 and JUCE build dependencies
        run: |
          wget -q https://apt.llvm.org/llvm.sh && sudo bash llvm.sh 20
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libgl1-mesa-dev
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20
          -DVERBATIM_BUILD_PLUGIN=OFF "-DCMAKE_CXX_FLAGS=${{ matrix.flags }}" "-DCMAKE_EXE_LINKER_FLAGS=${{ matrix.flags }}"
      - name: Build
        run: cmake --build build --target ${{ matrix.target }} --parallel
      - name: Tests
        env:
          RTSAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure -R "${{ matrix.filter }}"

  # RT3: lock and allocation audit of audio-thread functions.
  lock-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/lock_audit.py --self-test && python3 tools/lock_audit.py dsp
